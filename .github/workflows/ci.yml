name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          DUMMY_PAY_USERNAME: ${{ secrets.DUMMY_PAY_USERNAME }}
          DUMMY_PAY_PASSWORD: ${{ secrets.DUMMY_PAY_PASSWORD }}
          DUMMY_PAY_BAD_PASSWORD: ${{ secrets.DUMMY_PAY_BAD_PASSWORD }}
        # pytest.ini uses --headed, so give the browser a virtual display
        run: xvfb-run --auto-servernum python -m pytest tests --tracing retain-on-failure --output test-results

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
